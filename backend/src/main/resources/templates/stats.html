<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estadísticas Globales | AI Sentiment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card-stat { border-radius: 15px; border: none; color: white; height: 100%; }
        .bg-gradient-blue { background: linear-gradient(45deg, #2193b0, #6dd5ed); }
        .bg-gradient-green { background: linear-gradient(45deg, #11998e, #38ef7d); }
        .bg-gradient-red { background: linear-gradient(45deg, #cb2d3e, #ef473a); }
        .bg-gradient-yellow { background: linear-gradient(45deg, #f1c40f, #f39c12); color: black !important; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">SentimentAPI</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Analizador</a>
            <a class="nav-link active" href="/dashboard">Estadísticas</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="fw-bold mb-4">Reporte de Sentimientos Globales</h2>
    
    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <div class="card card-stat bg-gradient-blue p-4 shadow">
                <h6>Total Analizados</h6>
                <h1 class="fw-bold" th:text="${stats.total}">0</h1>
                <small>Basado en <span th:text="${stats.last}"></span> registros</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat bg-gradient-green p-4 shadow">
                <h6>Positivos</h6>
                <h1 class="fw-bold" th:text="${#numbers.formatDecimal(stats.positivoPct, 1, 1)} + '%'">0%</h1>
                <div class="progress mt-2" style="height: 5px; background: rgba(255,255,255,0.3);">
                    <div class="progress-bar bg-white" th:style="'width:' + ${stats.positivoPct} + '%'"></div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat bg-gradient-red p-4 shadow">
                <h6>Negativos</h6>
                <h1 class="fw-bold" th:text="${#numbers.formatDecimal(stats.negativoPct, 1, 1)} + '%'">0%</h1>
                <div class="progress mt-2" style="height: 5px; background: rgba(255,255,255,0.3);">
                    <div class="progress-bar bg-white" th:style="'width:' + ${stats.negativoPct} + '%'"></div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat bg-gradient-yellow p-4 shadow">
                <h6>Neutros</h6>
                <h1 class="fw-bold" th:text="${#numbers.formatDecimal(stats.neutroPct, 1, 1)} + '%'">0%</h1>
                <div class="progress mt-2" style="height: 5px; background: rgba(0,0,0,0.1);">
                    <div class="progress-bar bg-dark" th:style="'width:' + ${stats.neutroPct} + '%'"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6 text-center card p-5 shadow-sm bg-white">
            <h5 class="mb-4">Distribución de Sentimiento</h5>
            <canvas id="statsChart"></canvas>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const stats = [[${stats}]];
    new Chart(document.getElementById('statsChart'), {
        type: 'pie',
        data: {
            labels: ['Positivos (%)', 'Negativos (%)', 'Neutros (%)'],
            datasets: [{
                data: [stats.positivoPct, stats.negativoPct, stats.neutroPct],
                backgroundColor: ['#38ef7d', '#ef473a', '#f1c40f'],
                hoverOffset: 20
            }]
        },
        options: { plugins: { legend: { position: 'bottom' } } }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
